[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roast"
version = "4.0.0"
description = "Realistic vOlumetric-Approach-based Simulator for Transcranial electric stimulation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Yu (Andy) Huang and the Parra Lab at CCNY" }]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "nibabel>=3.2",
    "scikit-image>=0.19",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "h5py>=3.0",
]

[project.optional-dependencies]
targeting = ["cvxpy>=1.2"]
dev = ["pytest>=7.0"]

[project.scripts]
roast = "roast.cli:main"

[tool.setuptools.packages.find]
include = ["roast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
